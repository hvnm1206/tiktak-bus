plugins { id 'com.android.application' }
android {
  namespace 'com.nomahubvn.tiktak.dibo'
  compileSdk 35
  defaultConfig {
    applicationId 'com.nomahubvn.tiktak.dibo'
    minSdk 21
    targetSdk 35
    versionCode 1
    versionName '1.0'
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('KS_PATH') ?: 'release.jks')
      storePassword System.getenv('KS_PASS')
      keyAlias 'dibo'
      keyPassword System.getenv('KS_PASS')
    }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  implementation 'com.google.androidbrowserhelper:locationdelegation:1.1.1'
}
